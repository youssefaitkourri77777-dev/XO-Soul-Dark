function play(i){if(board[i]||over||paused)return;board[i]=turn;render();if(checkWin())return;turn=turn=='X'?'O':'X';saveAll();if(turn=='O'){let t=T();let txt=profile?(profile.gender=='female'?t.botThink_f(profile.name):t.botThink_m(profile.name)):t.turnBot;document.getElementById('status').innerText=txt;setTimeout(hardBot,200);}else{document.getElementById('status').innerText=getGreeting();}}
function render(){board.forEach((v,i)=>{let e=document.getElementById('c'+i);if(!e)return;e.innerText=v;e.className='cell'+(v?' '+v.toLowerCase():'')})}
function checkWin(){for(let c of W){let [a,b,d]=c;if(board[a]&&board[a]==board[b]&&board[a]==board[d]){over=true;c.forEach(ii=>{let el=document.getElementById('c'+ii);if(el)el.classList.add('win')});aiMemory.games++;if(board[a]=='X'){scores.X++;lvl++;aiMemory.intelligence=Math.min(95,aiMemory.intelligence+1);document.getElementById('status').innerText=getWinMsg();}else{scores.O++;document.getElementById('status').innerText=getLoseMsg();}saveAll();updateScore();updateAIInfo();setTimeout(()=>{localStorage.removeItem('xo_board');createBoard();},700);return true;}}if(!board.includes('')){over=true;scores.D++;aiMemory.games++;document.getElementById('status').innerText=T().draw(profile?profile.name:'');saveAll();updateScore();setTimeout(()=>{localStorage.removeItem('xo_board');createBoard();},600);return true}return false;}
function hardBot(){if(over)return;let intel=difficulty=='easy'?15:difficulty=='medium'?55:difficulty=='hard'?95:aiMemory.intelligence;if(Math.random()*100<intel){let m=findBest('O');if(m!=null){play(m);return}m=findBest('X');if(m!=null){play(m);return}if(board[4]==''){play(4);return}let corners=[0,2,6,8].filter(i=>board[i]=='');if(corners.length){play(corners[Math.floor(Math.random()*corners.length)]);return}}let emp=board.map((v,i)=>v?'':i).filter(v=>v!=='');if(emp.length)play(emp[Math.floor(Math.random()*emp.length)]);}
function findBest(p){for(let c of W){let [a,b,d]=c;if(board[a]==p&&board[b]==p&&board[d]=='')return d;if(board[a]==p&&board[d]==p&&board[b]=='')return b;if(board[b]==p&&board[d]==p&&board[a]=='')return a}return null}
function updatePower(){let pr=Math.min(5,Math.floor(lvl/200)+1);document.getElementById('power').innerText='★'.repeat(pr)+'☆'.repeat(5-pr)}
function updateScore(){document.getElementById('sx').innerText=scores.X;document.getElementById('so').innerText=scores.O;document.getElementById('sd').innerText=scores.D;saveAll()}
function togglePause(){paused=!paused;document.getElementById('pauseScreen').classList.toggle('hidden',!paused);if(paused){applyMode();setLang(lang);}}
createStars();buildAvatars();applyMode();setLang(lang);updateScore();updateProfileIcon();
if(!profile){document.getElementById('profileScreen').classList.remove('hidden');}else{createBoard();setDiff(difficulty);}
document.getElementById('d_easy').onclick=()=>setDiff('easy');document.getElementById('d_medium').onclick=()=>setDiff('medium');document.getElementById('d_hard').onclick=()=>setDiff('hard');document.getElementById('d_adaptive').onclick=()=>setDiff('adaptive');
</script>
